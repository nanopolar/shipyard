<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shipyard</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏗️</text></svg>">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d1117; --surface: #161b22; --border: #30363d;
      --text: #e6edf3; --muted: #8b949e; --accent: #238636; --accent-hover: #2ea043;
      --danger: #da3633; --radius: 8px;
    }
    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 40px 32px; width: 100%; max-width: 360px;
    }
    .logo { text-align: center; margin-bottom: 32px; }
    .logo-icon { font-size: 48px; display: block; margin-bottom: 12px; }
    h1 { font-size: 22px; font-weight: 700; }
    .subtitle { font-size: 13px; color: var(--muted); margin-top: 4px; }
    .error-banner {
      background: rgba(218,54,51,0.12); border: 1px solid rgba(218,54,51,0.4);
      color: #ff7b72; padding: 10px 14px; border-radius: var(--radius);
      font-size: 13px; margin-bottom: 20px;
    }
    label { display: block; font-size: 12px; font-weight: 600; color: var(--muted);
      margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.05em; }
    input[type="password"] {
      width: 100%; background: var(--bg); border: 1px solid var(--border);
      border-radius: var(--radius); color: var(--text); font-size: 15px;
      padding: 10px 14px; outline: none; transition: border-color 0.15s;
    }
    input[type="password"]:focus { border-color: #388bfd; }
    button {
      width: 100%; background: var(--accent); color: #fff; border: none;
      border-radius: var(--radius); font-size: 15px; font-weight: 600;
      padding: 11px; margin-top: 20px; cursor: pointer; transition: background 0.15s;
    }
    button:hover { background: var(--accent-hover); }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <span class="logo-icon">🏗️</span>
      <h1>Shipyard</h1>
      <p class="subtitle">Sign in to manage deployments</p>
    </div>
    <div id="error" class="error-banner" style="display:none">Incorrect password - try again.</div>
    <form method="POST" action="/login">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" autofocus required>
      <button type="submit">Sign in</button>
    </form>
  </div>
  <script>
    if (location.search.includes('error=1')) document.getElementById('error').style.display = 'block';
  </script>
</body>
</html>
